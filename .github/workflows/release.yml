name: Release MultiGram
run-name: Release ${{ inputs.ref }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Builds the release APK of a MultiGram commit and publishes it as a GitHub Release.
#
# Version: Forkgram's own scheme, APP_VERSION_NAME.N (for example 12.10.6.1), where APP_VERSION_NAME
# comes from gradle.properties of the Forkgram snapshot and N (1 to 9) counts MultiGram releases on
# that Forkgram version. The Android versionCode is (APP_VERSION_CODE * 10 + N) * 10 + 9, so every
# release installs as an update over the one before, and a new Forkgram version starts again at N = 1.
# The tag is the version itself, like Forkgram's tags.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to release
        default: multigram
        required: true
      number:
        description: MultiGram build number for this Forkgram version (1 to 9). Empty picks the next free one.
        required: false
        default: ''
      prerelease:
        description: Mark it as a pre-release (always the case without your own signing key)
        type: boolean
        default: false
      dry_run:
        description: Only work out the version and the release notes; build and publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check_secrets:
    # A job of its own, so that no secret value is registered in the job that writes the release
    # notes: the runner drops any job output that contains a secret's value (a key alias like
    # "release" would otherwise blank the notes).
    name: Check the secrets
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.s.outputs.signed }}
    steps:
      - name: Check the secrets
        id: s
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          APP_ID: ${{ secrets.MULTIGRAM_APP_ID }}
          APP_HASH: ${{ secrets.MULTIGRAM_APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.MULTIGRAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MULTIGRAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MULTIGRAM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Stop here, in seconds, rather than after the long build. A dry run only warns.
          problem() { if [ "$DRY_RUN" = true ]; then echo "::warning::$1"; else echo "::error::$1"; exit 1; fi; }
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            problem "The MULTIGRAM_APP_ID and MULTIGRAM_APP_HASH secrets are not set, so the APK could not log in. Add them (Settings > Secrets and variables > Actions) and run this again."
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              problem "MULTIGRAM_KEYSTORE_BASE64 is set, but MULTIGRAM_KEYSTORE_PASSWORD or MULTIGRAM_KEY_ALIAS is not: signing would fail at the end of the build. Add both."
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No MULTIGRAM_KEYSTORE_BASE64 secret: the release will be signed with Forkgram's public test key and published as a pre-release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Work out the version
    needs: check_secrets
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      number: ${{ steps.v.outputs.number }}
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Version, secrets and release notes
        id: v
        env:
          NUMBER: ${{ inputs.number }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
          SIGNED: ${{ needs.check_secrets.outputs.signed }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          sha=$(git rev-parse HEAD)
          name=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tail -n 1)
          code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | tail -n 1)
          [[ "$name" =~ ^[0-9]+(\.[0-9]+)*$ ]] || fail "APP_VERSION_NAME in gradle.properties is '$name', not a version number."
          [[ "$code" =~ ^[0-9]+$ ]] || fail "APP_VERSION_CODE in gradle.properties is '$code', not a number."

          # The next free N for this Forkgram version, from the tags that already exist.
          last=$(git tag -l "$name.*" | sed -n "s/^${name//./\\.}\.\([0-9]\)$/\1/p" | sort -n | tail -n 1)
          if [ -n "$NUMBER" ]; then
            n=$NUMBER
          else
            n=$(( ${last:-0} + 1 ))
          fi
          [[ "$n" =~ ^[1-9]$ ]] || fail "The MultiGram build number must be 1 to 9 (got '$n'). Nine releases on Forkgram $name are the most its version codes allow; wait for the next Forkgram version."
          version="$name.$n"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            fail "Tag $version already exists: MultiGram $version is already released. Leave the number empty to take the next free one."
          fi
          if [ -n "$last" ] && [ "$n" -le "$last" ]; then
            echo "::warning::$name.$last is already released, so $version has a lower version code and will not install as an update over it."
          fi
          version_code=$(( (code * 10 + n) * 10 + 9 ))

          # What it is built on, from the snapshot commit the sync made.
          snap=$(git log -n 1 --format=%H --grep='^Forkgram-Version: ' HEAD || true)
          fg_version=unknown; tg_version=unknown
          if [ -n "$snap" ]; then
            msg=$(git log -1 --format=%B "$snap")
            fg_version=$(printf '%s\n' "$msg" | sed -n 's/^Forkgram-Version: //p' | head -n 1)
            tg_version=$(printf '%s\n' "$msg" | sed -n 's/^Telegram-Base: .*(update to \([0-9.]*\).*/\1/p' | head -n 1)
            fg_version=${fg_version:-unknown}; tg_version=${tg_version:-unknown}
          fi

          signed=${SIGNED:-false}
          prerelease=$PRERELEASE
          [ "$signed" = true ] || prerelease=true

          notes=$(mktemp)
          {
            echo "MultiGram $version is Forkgram $fg_version (Telegram $tg_version) with the MultiGram changes listed below."
            echo
            if [ "$signed" = true ]; then
              echo "**Signing:** signed with the MultiGram release key. It installs as an update over earlier MultiGram releases signed with the same key."
            else
              echo "**Signing: public test key.** This APK is signed with Forkgram's public test key (\`TMessagesProj/config/test.keystore\`), because the repository has no \`MULTIGRAM_KEYSTORE_BASE64\` secret. Anyone can sign an \"update\" for it, and a later release signed with a real key cannot update it. Use it for testing only."
            fi
            echo
            echo "**Version:** $version (Android version code $version_code). Built from $sha."
            echo
            echo "**MultiGram changes on top of Forkgram $fg_version:**"
            echo
            if [ -n "$snap" ]; then
              git log --reverse --format='- %s (%h)' "$snap..HEAD"
            else
              echo "- (no Forkgram snapshot found in the history)"
            fi
          } > "$notes"

          {
            echo "sha=$sha"
            echo "number=$n"
            echo "version=$version"
            echo "version_code=$version_code"
            echo "prerelease=$prerelease"
            echo "notes<<MULTIGRAM_NOTES_EOF"
            cat "$notes"
            echo "MULTIGRAM_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$DRY_RUN" = true ]; then echo "## MultiGram $version (dry run: nothing built or published)"; else echo "## MultiGram $version"; fi
            echo
            echo "Pre-release: $prerelease"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$notes"

  build:
    name: Build
    needs: [check_secrets, prepare]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      apk: true
      build_number: ${{ needs.prepare.outputs.number }}
    secrets: inherit

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multigram-apk
          path: apk
      - name: Check the APK and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          shopt -s nullglob
          apks=(apk/*.apk)
          [ "${#apks[@]}" -eq 1 ] || fail "Expected one APK in the build artifact, found ${#apks[@]}."
          file="MultiGram-$VERSION.apk"
          mv "${apks[0]}" "$file"

          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          badging=$("$tools/aapt2" dump badging "$file" | head -n 1)
          echo "$badging"
          got_name=$(printf '%s' "$badging" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          got_code=$(printf '%s' "$badging" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
          [ "$got_name" = "$VERSION" ] || fail "The APK says versionName $got_name, expected $VERSION."
          [ "$got_code" = "$VERSION_CODE" ] || fail "The APK says versionCode $got_code, expected $VERSION_CODE."
          cert=$("$tools/apksigner" verify --print-certs "$file" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [ -n "$cert" ] || fail "apksigner could not verify the APK's signature."
          sha256sum "$file" > SHA256SUMS

          {
            printf '%s\n' "$NOTES"
            echo
            echo "**Checksums:** \`$(cut -d' ' -f1 SHA256SUMS)\` ($file, SHA-256). Signing certificate SHA-256: \`$cert\`."
          } > notes.md

          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" "$file" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "MultiGram $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
