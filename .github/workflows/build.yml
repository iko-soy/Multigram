name: Build MultiGram
run-name: Build ${{ inputs.ref }}${{ inputs.apk && ' (APK)' || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: multigram
        required: true
      apk:
        description: Also build a full release APK (slow, compiles the native code)
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      apk:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    name: Compile Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch the submodules the Java build needs
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          # buildNativeDeps compiles ffmpeg, libvpx, dav1d and friends; the Java and Kotlin
          # compile does not need them, so skip it here (the apk job builds them).
          ./gradlew --no-daemon --stacktrace -x :TMessagesProj:buildNativeDeps \
            :TMessagesProj:compileReleaseJavaWithJavac \
            :TMessagesProj_App:compileAfatReleaseJavaWithJavac
      - name: Run MultiGram tool checks
        if: hashFiles('multigram/tools/check.sh') != ''
        run: bash multigram/tools/check.sh

  apk:
    name: Release APK
    if: ${{ inputs.apk }}
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
      - name: Add swap space
        # Runners for private repositories have about 8 GB of memory; the native build and the
        # Gradle and Kotlin daemons together can use more, and the runner dies without a log.
        run: |
          sudo fallocate -l 8G /multigram-swap
          sudo chmod 600 /multigram-swap
          sudo mkswap /multigram-swap
          sudo swapon /multigram-swap
          free -h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install NDK for the JNI build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Build
        env:
          APP_ID: ${{ secrets.MULTIGRAM_APP_ID }}
          APP_HASH: ${{ secrets.MULTIGRAM_APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.MULTIGRAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MULTIGRAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MULTIGRAM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MULTIGRAM_KEY_PASSWORD }}
        run: |
          vars=gradle.properties
          echo "org.gradle.workers.max=1" >> $vars
          # Forkgram asks for an 8 GB heap, sized for the bigger runners of public repositories.
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" >> $vars
          echo "kotlin.daemon.jvmargs=-Xmx2g" >> $vars
          echo "org.gradle.parallel=false" >> $vars
          [ -n "$APP_ID" ] && echo "APP_ID=$APP_ID" >> $vars
          [ -n "$APP_HASH" ] && echo "APP_HASH=$APP_HASH" >> $vars
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Your own release key, from the MULTIGRAM_KEYSTORE_* secrets; it never touches the repository.
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            signing=(
              "-PRELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              "-PRELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              "-PRELEASE_KEY_ALIAS=$KEY_ALIAS"
              "-PRELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            )
          else
            # Without RELEASE_KEYSTORE_FILE the build signs with the public test key in
            # TMessagesProj/config/test.keystore: fine for testing, not for an APK you give out.
            echo "::warning::No MULTIGRAM_KEYSTORE_BASE64 secret: the APK is signed with the public test key."
          fi
          sudo apt update
          sudo apt -y install ninja-build meson nasm gperf pkg-config unzip
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          ./gradlew "${signing[@]}" :TMessagesProj_App:assembleAfatRelease
      - uses: actions/upload-artifact@v4
        with:
          name: multigram-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
